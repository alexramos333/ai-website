name: Zodiak Video Agent

on:
  # Daily at 9 AM ET (13:00 UTC) — uncomment when ready for production
  # schedule:
  #   - cron: "0 13 * * *"

  workflow_dispatch:
    inputs:
      topic_override:
        description: "Override topic selection with a specific topic"
        required: false
        type: string
      dry_run:
        description: "Run without making external API calls"
        required: false
        type: boolean
        default: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        run: pip install -r agent/requirements.txt

      - name: Write GCP credentials
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}' > /tmp/gcp-sa.json

      - name: Run video agent
        working-directory: agent
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEFAULT_AUTHOR_ID: ${{ secrets.DEFAULT_AUTHOR_ID }}
          ANTHROPIC_API_KEY_ZODIAK_AGENT: ${{ secrets.ANTHROPIC_API_KEY_ZODIAK_AGENT }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-sa.json
          SHOTSTACK_API_KEY_SANDBOX: ${{ secrets.SHOTSTACK_API_KEY_SANDBOX }}
          SHOTSTACK_API_KEY_PRODUCTION: ${{ secrets.SHOTSTACK_API_KEY_PRODUCTION }}
          SHOTSTACK_ENV: ${{ secrets.SHOTSTACK_ENV || 'sandbox' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VEO_MONTHLY_SPEND_CAP: ${{ secrets.VEO_MONTHLY_SPEND_CAP || '15.0' }}
          SHOTSTACK_DAILY_RENDER_CAP: ${{ secrets.SHOTSTACK_DAILY_RENDER_CAP || '3' }}
        run: |
          ARGS="--trigger cron"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.topic_override }}" ]; then
            ARGS="$ARGS --topic '${{ inputs.topic_override }}'"
          fi
          python run.py $ARGS

      - name: Cleanup GCP credentials
        if: always()
        run: rm -f /tmp/gcp-sa.json
