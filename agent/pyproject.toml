[project]
name = "zodiak-agent"
version = "0.1.0"
description = "Automated daily AI video agent for trending topic discovery, video generation, and blog publishing"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
